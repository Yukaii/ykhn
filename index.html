<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa.svg" />
    <link rel="apple-touch-icon" href="/icons/ykhn-192-rounded.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <title>YKHN - RETRO TERMINAL</title>
    <script>
      // Apply persisted theme/style/font before first paint to avoid a flash.
      ;(function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('ykhn-theme')
          if (
            theme === 'commander' ||
            theme === 'dark' ||
            theme === 'light' ||
            theme === 'hackernews'
          ) {
            root.dataset.theme = theme
            root.dataset.themeAppearance =
              theme === 'light' || theme === 'hackernews' ? 'light' : 'dark'
          }
          var style = localStorage.getItem('ykhn-style')
          if (
            style === 'classic' ||
            style === 'modern' ||
            style === 'retro' ||
            style === 'office' ||
            style === 'y2k' ||
            style === 'og'
          ) {
            root.dataset.style = style
          }
          var font = localStorage.getItem('ykhn-font-mode')
          if (font === 'readable' || font === 'balanced' || font === 'retro') {
            root.dataset.font = font
          }
          var size = Number.parseFloat(localStorage.getItem('ykhn-font-size'))
          if (size > 0) root.style.setProperty('--tui-font-size', size + 'px')
        } catch (error) {
          /* storage unavailable */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
